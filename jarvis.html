```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON JARVIS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050914;
 color:#00eaff;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{
 padding:22px;
 border-bottom:1px solid #00eaff55;
 letter-spacing:5px;
 font-size:25px;
 font-weight:bold;
}
.container{
 max-width:750px;
 margin:65px auto;
 padding:25px;
}
.circle{
 width:180px;height:180px;
 border:3px solid #00eaff;
 border-radius:50%;
 margin:20px auto;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;
 box-shadow:0 0 35px #00eaff;
 animation:pulse 2s infinite;
}
@keyframes pulse{
 50%{box-shadow:0 0 65px #00eaff}
}
h1{letter-spacing:5px}
#status{color:#8daab5;margin:20px}
input{
 width:75%;
 padding:15px;
 border:1px solid #00eaff;
 background:#101b2b;
 color:white;
 border-radius:8px;
 outline:none;
}
button{
 padding:14px 20px;
 margin:8px;
 border:1px solid #00eaff;
 background:#071c2b;
 color:#00eaff;
 border-radius:8px;
 cursor:pointer;
}
button:hover{
 background:#00eaff;
 color:#001018;
 box-shadow:0 0 20px #00eaff;
}
#output{
 margin:25px auto;
 padding:20px;
 background:#101b2b;
 border-radius:10px;
 min-height:70px;
 color:white;
 line-height:1.6;
}
footer{
 margin-top:80px;
 padding:20px;
 color:#56717c;
}
</style>
</head>

<body>

<header>NEON TECHNOLOGIES</header>

<div class="container">

<div class="circle">🤖</div>

<h1>NEON JARVIS</h1>
<p>YOUR PERSONAL DIGITAL ASSISTANT</p>

<div id="status">SYSTEM ONLINE • READY</div>

<input id="command" placeholder="Type your command here...">

<br>

<button onclick="runCommand()">EXECUTE</button>
<button onclick="startVoice()">🎙 VOICE</button>
<button onclick="clearChat()">CLEAR</button>

<div id="output">
JARVIS: Welcome! Systems are ready.
</div>

</div>

<footer>
NEON JARVIS WEB 1.0<br>
POWERED BY NEON TECHNOLOGIES
</footer>

<script>
const output=document.getElementById("output");
const input=document.getElementById("command");
const statusText=document.getElementById("status");

function speak(text){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  let msg=new SpeechSynthesisUtterance(text);
  msg.rate=1;
  speechSynthesis.speak(msg);
 }
}

function reply(text){
 output.innerHTML="<b>JARVIS:</b> "+text;
 speak(text);
}

function runCommand(){
 let cmd=input.value.toLowerCase().trim();

 if(!cmd)return;

 if(cmd.includes("hello") || cmd.includes("hi")){
  reply("Hello! NEON JARVIS is online. How can I help you?");
 }
 else if(cmd.includes("time")){
  reply("The current time is "+new Date().toLocaleTimeString());
 }
 else if(cmd.includes("date")){
  reply("Today's date is "+new Date().toLocaleDateString());
 }
 else if(cmd.includes("youtube")){
  reply("Opening YouTube.");
  window.open("https://www.youtube.com","_blank");
 }
 else if(cmd.includes("google")){
  reply("Opening Google.");
  window.open("https://www.google.com","_blank");
 }
 else if(cmd.includes("neon")){
  reply("NEON TECHNOLOGIES. BUILD BEYOND.");
 }
 else if(cmd.includes("who are you")){
  reply("I am NEON JARVIS, a digital assistant developed for NEON TECHNOLOGIES.");
 }
 else if(cmd.includes("help")){
  reply("Try commands like hello, time, date, open YouTube, open Google, or who are you.");
 }
 else{
  reply("I don't have a programmed response for that command yet. Try typing help.");
 }

 input.value="";
}

function startVoice(){
 const SpeechRecognition=window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  reply("Voice recognition is not supported in this browser. Please try a compatible browser.");
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="en-IN";
 recognition.onstart=()=>{
  statusText.innerText="LISTENING...";
 };
 recognition.onresult=(event)=>{
  input.value=event.results[0][0].transcript;
  runCommand();
 };
 recognition.onerror=()=>{
  statusText.innerText="VOICE ERROR • TRY AGAIN";
 };
 recognition.onend=()=>{
  statusText.innerText="SYSTEM ONLINE • READY";
 };
 recognition.start();
}

function clearChat(){
 output.innerHTML="JARVIS: Conversation cleared. Systems ready.";
 input.value="";
}

input.addEventListener("keydown",function(e){
 if(e.key==="Enter")runCommand();
});
</script>

</body>
</html>
